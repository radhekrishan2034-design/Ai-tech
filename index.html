
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-TECH - My AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0f172a;color:white;display:flex;flex-direction:column;height:100vh}
.top{background:#1e293b;padding:12px;text-align:center;border-bottom:1px solid #334155}
.top h2{font-size:18px}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.4}
.user{align-self:flex-end;background:#3b82f6;border-radius:18px 18px 2px 18px}
.ai{align-self:flex-start;background:#1e293b;border:1px solid #334155;border-radius:18px 18px 18px 2px}
.bottom{display:flex;gap:8px;padding:12px;background:#1e293b}
.bottom input{flex:1;padding:12px 16px;border-radius:30px;border:1px solid #334155;background:#0f172a;color:white;outline:none}
.bottom button{padding:12px 20px;border-radius:30px;border:none;background:#3b82f6;color:white;font-weight:bold}
</style>
</head>
<body>

<div class="top">
<h2>🤖 AI-TECH - Apna AI</h2>
<p style="font-size:11px;color:#94a3b8">Made by Radhe | Aapka Khud Ka ChatGPT</p>
</div>

<div id="chat">
<div class="msg ai">Namaste Radhe! 🙏 Mai aapka apna AI hu. Ab aap jo bhi puchoge, mai yahi par jawab dunga. Pucho kuch?</div>
</div>

<div class="bottom">
<input id="input" placeholder="Yaha likho...">
<button onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById('chat');
const inp = document.getElementById('input');

async function send(){
 if(!inp.value.trim()) return;
 let q = inp.value;
 chat.innerHTML += `<div class="msg user">${q}</div>`;
 inp.value = '';
 chat.scrollTop = chat.scrollHeight;

 let id = Date.now();
 chat.innerHTML += `<div class="msg ai" id="${id}">Soch raha hu...</div>`;
 
 try{
  // Free AI API - No Key Needed for Demo
  let res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(q)}?model=openai`);
  let ans = await res.text();
  document.getElementById(id).innerText = ans;
 }catch(e){
  document.getElementById(id).innerText = "Bhai network slow hai, fir se pucho. Lekin mai aapka hi AI hu, ab bahar nahi jaunga!";
 }
 chat.scrollTop = chat.scrollHeight;
}

inp.addEventListener('keypress', (e)=>{ if(e.key==='Enter') send(); });
</script>

</body>
</html>
