<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tech - Future Tech</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans">
<div class="max-w-md mx-auto min-h-screen p-4">
  <h1 class="text-3xl font-bold text-center mt-6 bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">AI-TECH</h1>
  <p class="text-center text-gray-400 mt-2">Your Daily AI & Tech Hub</p>
  
  <div class="mt-8 space-y-4">
    <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
      <h2 class="font-bold text-lg">🤖 AI Tools</h2>
      <p class="text-sm text-gray-400 mt-1">ChatGPT, Gemini, Image Gen, Code Help</p>
      <button onclick="alert('AI Chat Coming Soon!')" class="mt-3 w-full bg-white text-black py-2 rounded-xl font-bold">Open AI Chat</button>
    </div>
    
    <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
      <h2 class="font-bold text-lg">📱 Latest Tech News</h2>
      <p class="text-sm text-gray-400 mt-1">Latest mobile, laptop, AI news in Hindi + English</p>
      <button onclick="alert('News Feed Loading...')" class="mt-3 w-full bg-zinc-800 py-2 rounded-xl font-bold">Read News</button>
    </div>

    <div class="bg-gradient-to-r from-cyan-600 to-blue-600 p-4 rounded-2xl">
      <h2 class="font-bold">🚀 Made by Radhe</h2>
      <p class="text-sm mt-1">Private Project - Ai-tech</p>
    </div>
  </div>
  
  <p class="text-center text-xs text-gray-600 mt-10">© 2026 Ai-tech - All rights reserved</p>
</div>

</html>
