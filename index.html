<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
:root{--o:#FF8C00;--d:#0B1F44;--w:#fff}

.grid{padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--w);border-radius:16px;padding:16px 6px;text-align:center;box-shadow:0 3px 10px #0001;cursor:pointer}

.card h4{font-size:12px;color:var(--d);font-weight:700}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:var(--d);border-radius:24px 24px 0 0;display:flex;justify-content:space-around;padding:12px 0}

.modal{position:fixed;inset:0;background:var(--d);z-index:100;display:none;flex-direction:column;max-width:420px;margin:0 auto;left:50%;transform:translateX(-50%)}
.mh{padding:14px;background:var(--d);color:var(--w);display:flex;gap:10px;align-items:center}
.mb{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f5f7fb}
.msg{max-width:85%;padding:12px;border-radius:16px;font-size:13px;animation:pop .2s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.u{align-self:flex-end;background:var(--o);color:var(--w)}.a{align-self:flex-start;background:var(--w);color:var(--d);border:1px solid #e2e8f0;white-space:pre-wrap}

.mf button{padding:12px 18px;border-radius:30px;border:none;background:var(--o);color:var(--w);font-weight:800}
.loader{width:20px;height:20px;border:2px solid #fff;border-top:2px solid var(--o);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="card" onclick="openTool('AI Writing','writing')"><i class="fas fa-pen"></i><h4>Writing</h4></div>

<div class="card" onclick="openTool('AI PDF','pdf')"><i class="fas fa-file-pdf"></i><h4>PDF</h4></div>
<div class="card" onclick="openTool('AI Music','music')"><i class="fas fa-music"></i><h4>Music</h4></div>
<div class="card" onclick="openTool('AI Translator','translator')"><i class="fas fa-language"></i><h4>Translator</h4></div>
<div class="card" onclick="openTool('AI Code','code')"><i class="fas fa-code"></i><h4>Code</h4></div>
<div class="card" onclick="openTool('AI Logo','logo')"><i class="fas fa-palette"></i><h4>Logo</h4></div>
</div>
<div class="bottom"><div class="active"><i class="fas fa-house"></i>Home</div><div><i class="fas fa-toolbox"></i>Tools</div><div><i class="fas fa-bolt"></i>Fast</div><div><i class="fas fa-user"></i>Profile</div></div>
